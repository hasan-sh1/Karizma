<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charisma Barber Shop</title>
<meta name="description" content="Follow Charisma Barber Shop on Instagram, TikTok and WhatsApp.">
<meta name="theme-color" content="#080f1e">
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* ألوان صالون الحلاقة الكلاسيكية */
    --red: #e63946;
    --blue: #1d4ed8;
    --blue-hi: #3b82f6;
    --white: #f8f9fa;
    --bg-dark: #080f1e;
    --bg-light: #16243d;
    
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{height:100%}
  body{
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(28px,6vh,56px) 44px calc(28px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(55% 36% at 50% 20%, rgba(29, 78, 216, 0.24), transparent 70%),
      radial-gradient(50% 35% at 50% 85%, rgba(230, 57, 70, 0.14), transparent 70%),
      linear-gradient(180deg, var(--bg-light), var(--bg-dark) 65%);
    color:var(--white);font-family:var(--sans);overflow-x:hidden;
  }

  /* أعمدة الحلاقة الجانبية بالأحمر والأزرق والأبيض */
  .pole{
    position:fixed;top:0;bottom:0;width:16px;
    background:repeating-linear-gradient(
      -45deg,
      var(--red) 0 12px,
      var(--white) 12px 24px,
      var(--blue) 24px 36px,
      var(--white) 36px 48px
    );
    background-size:67.88px 67.88px;
    animation:pole 3s linear infinite;
    box-shadow:inset 3px 0 6px rgba(0,0,0,.6),inset -3px 0 6px rgba(0,0,0,.6);
  }
  .pole.l{left:0;border-right:1px solid rgba(255,255,255,0.2)}
  .pole.r{right:0;border-left:1px solid rgba(255,255,255,0.2)}
  @keyframes pole{to{background-position:0 67.88px}}

  main{width:100%;max-width:380px;text-align:center}

  /* الشعار مع إضاءة ولمعة */
  .logo{position:relative;width:min(60vw,240px);aspect-ratio:1;margin:0 auto;
    opacity:0;transform:scale(.92);animation:logoIn 1.1s cubic-bezier(.2,.7,.2,1) .15s forwards;
    filter:drop-shadow(0 12px 30px rgba(230, 57, 70, 0.3))}
  .logo img{width:100%;height:100%;display:block}
  .logo::after{
    content:"";position:absolute;inset:0;
    -webkit-mask:url(logo.png) center/contain no-repeat;mask:url(logo.png) center/contain no-repeat;
    background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%) 160% 0/250% 100% no-repeat;
    animation:shine 5.5s ease-in-out 1.6s infinite;
  }
  @keyframes logoIn{to{opacity:1;transform:none}}
  @keyframes shine{0%{background-position:160% 0}35%,100%{background-position:-60% 0}}

  h1{
    font-family:var(--serif);font-weight:700;font-size:clamp(3.2rem,16vw,4.6rem);line-height:1;letter-spacing:.02em;
    margin-top:22px;
    color: var(--white);
    text-shadow: 0 2px 12px rgba(29, 78, 216, 0.45);
    opacity:0;animation:fade .9s ease 1s forwards;
  }
  .sub{
    display:flex;align-items:center;gap:14px;justify-content:center;margin-top:10px;
    font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.25rem;
    color: #cbd5e1;
    opacity:0;animation:fade .9s ease 1.2s forwards;
  }
  .sub::before{content:"";height:1px;width:44px;background:linear-gradient(90deg,transparent,var(--blue-hi))}
  .sub::after{content:"";height:1px;width:44px;background:linear-gradient(90deg,var(--red),transparent)}
  @keyframes fade{to{opacity:1}}

  .links{list-style:none;padding:0;margin-top:34px;display:grid;gap:14px}
  .links li{opacity:0;animation:fade .6s ease forwards}
  .links li:nth-child(1){animation-delay:1.3s}
  .links li:nth-child(2){animation-delay:1.45s}
  .links li:nth-child(3){animation-delay:1.6s}
  .links li:nth-child(4){animation-delay:1.75s}

  /* الأزرار بألوان وإطارات متحركة تلقائياً للهاتف */
  .links a{
    position:relative;display:flex;align-items:center;gap:14px;overflow:hidden;
    padding:14px 18px;border-radius:999px;
    color:var(--white);text-decoration:none;text-align:left;
    border:1.5px solid transparent;
    /* طبقتان: الأولى للخلفية الداخلية المتموجة، والثانية للإطار المتدفق */
    background:
      linear-gradient(90deg, rgba(29,78,216,.42) 0%, rgba(12,22,44,.88) 32%, rgba(230,57,70,.42) 50%, rgba(12,22,44,.88) 78%, rgba(29,78,216,.42) 100%) padding-box,
      linear-gradient(90deg, var(--blue-hi) 0%, var(--white) 25%, var(--red) 50%, var(--white) 75%, var(--blue-hi) 100%) border-box;
    background-size:200% 100%, 200% 100%;
    animation:btnFlow 4.5s linear infinite, btnGlow 4.5s ease-in-out infinite;
    transition:transform .18s ease;-webkit-tap-highlight-color:transparent;
  }

  /* توقيت متتابع بين الأزرار لتبدو كأنها موجة واحدة */
  .links li:nth-child(2) a{animation-delay:-1.5s, -1.5s}
  .links li:nth-child(3) a{animation-delay:-3s, -3s}
  .links li:nth-child(4) a{animation-delay:-4.5s, -4.5s}

  /* لمعة ضوئية تعبر الأزرار تلقائياً */
  .links a::after{
    content:"";position:absolute;top:0;bottom:0;left:-80%;width:60%;
    background:linear-gradient(110deg, transparent, rgba(255,255,255,.28), transparent);
    transform:skewX(-20deg);
    animation:btnShine 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  .links li:nth-child(1) a::after{animation-delay:1.8s}
  .links li:nth-child(2) a::after{animation-delay:2.3s}
  .links li:nth-child(3) a::after{animation-delay:2.8s}
  .links li:nth-child(4) a::after{animation-delay:3.3s}

  @keyframes btnFlow{
    0%{background-position:0% 0, 0% 0}
    100%{background-position:200% 0, 200% 0}
  }
  @keyframes btnGlow{
    0%,100%{box-shadow:0 6px 20px rgba(29, 78, 216, 0.32)}
    50%{box-shadow:0 6px 22px rgba(230, 57, 70, 0.38)}
  }
  @keyframes btnShine{
    0%, 65%{left:-80%}
    100%{left:140%}
  }

  /* تأثير اللمس المباشر على الهاتف */
  .links a:active{transform:scale(.96);filter:brightness(1.2)}
  .links a:focus-visible{outline:2px solid var(--white);outline-offset:3px}
  .links a>*{position:relative;z-index:1}

  /* الأيقونات والسهم الجانبي المتحرك */
  .ico{
    width:24px;height:24px;flex:none;
    stroke:var(--white);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(230, 57, 70, 0.65));
  }
  .ico.f{fill:var(--white);stroke:none}
  .go{
    margin-left:auto;width:18px;height:18px;
    stroke:var(--white);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    opacity:.85;
    animation:arrowNudge 2s ease-in-out infinite;
  }
  @keyframes arrowNudge{
    0%,100%{transform:translateX(0)}
    50%{transform:translateX(4px)}
  }

  .txt{display:flex;flex-direction:column;line-height:1.2}
  .txt b{font-weight:500;font-size:1.04rem;letter-spacing:.01em}
  .txt small{font-size:.8rem;opacity:.8}

  footer{margin-top:34px;font-size:.78rem;opacity:.55}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
    .logo,h1,.sub,.links li{opacity:1;transform:none}
    .logo::after,.links a::after{display:none}
  }
  @media (max-height:700px){.logo{width:150px}.links{margin-top:22px}}
</style>
</head>
<body>
  <div class="pole l" aria-hidden="true"></div>
  <div class="pole r" aria-hidden="true"></div>

  <main>
    <div class="logo"><img src="logo.png" alt="Karisma Barber Shop logo" width="720" height="720"></div>
    <h1>Karisma</h1>
    <p class="sub">Barber Shop</p>

    <ul class="links">
      <li><a href="https://www.instagram.com/ryad_s_adlbe" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg>
        <span class="txt"><b>Instagram</b><small>@ryad_s_adlbe</small></span>
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
      <li><a href="https://www.tiktok.com/@ryad_adlby" target="_blank" rel="noopener">
        <svg class="ico f" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3c.3 2.2 1.7 3.8 4 4v3.2c-1.5 0-2.9-.5-4-1.3V15a6 6 0 1 1-6-6c.3 0 .7 0 1 .1v3.3a2.8 2.8 0 1 0 2 2.7V3h3z"/></svg>
        <span class="txt"><b>TikTok</b><small>@ryad_adlby</small></span>
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
      <li><a href="https://wa.me/message/PD4CM2H6GZTSI1" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l1.6-4.7A9 9 0 1 1 8 19.5L3 21z"/><path d="M9 9c0 3 3 6 6 6l1-2-2-1-1 .8c-1-.4-2-1.4-2.4-2.4L11 10 10 8 9 9z" fill="currentColor" stroke="none"/></svg>
        <span class="txt"><b>WhatsApp</b><small>Message us to book</small></span>
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
      <!-- MAPS: after you create the pin / Google listing, put its link in href and delete the "hidden" attribute -->
      <li hidden><a href="https://maps.app.goo.gl/REPLACE_ME" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span class="txt"><b>Find us</b><small>Open in Google Maps</small></span>
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
    </ul>

    <footer>&copy; Karisma Barber Shop</footer>
  </main>
</body>
</html>
